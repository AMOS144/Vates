name: Bug 报告
description: 报告可复现的错误或异常行为
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 vates。提交前请搜索现有 Issue，并移除日志中的敏感信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰说明发生了什么，以及问题造成的影响。
      placeholder: 描述实际观察到的错误或异常行为。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定、可重复执行的步骤。
      placeholder: |
        1. 执行……
        2. 输入……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 请说明你认为正确的行为。
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      description: 例如 MacBook Pro M3 Max、统一内存容量。
      placeholder: Mac 型号、芯片、统一内存
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 26.0
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      description: 可通过 python --version 获取。
      placeholder: 例如 Python 3.12.13
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: 项目版本或提交
      description: 请提供 git rev-parse --short HEAD 的输出。
      placeholder: 提交哈希
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 运行命令与配置
      description: 请提供完整命令、相关环境变量及非敏感配置。
      render: bash
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或错误信息
      description: 请粘贴完整堆栈和相关日志，并删除路径、令牌等敏感信息。
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可提供截图、最小复现仓库或其他有助于定位问题的信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题。
          required: true
        - label: 我已移除日志中的个人信息、令牌和其他敏感内容。
          required: true
        - label: 我已阅读并同意遵守项目行为准则。
          required: true

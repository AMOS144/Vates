name: 功能建议
description: 建议新功能、改进方向或开发者体验优化
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议。请优先描述真实使用场景和待解决的问题，而不仅是具体实现。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么情况下使用这项能力？
      placeholder: 描述具体用户、设备、模型和工作流程。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 现有行为为什么无法满足需求？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、接口或使用方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明已经尝试或考虑过的替代方案。

  - type: textarea
    id: impact
    attributes:
      label: 性能与兼容性影响
      description: 说明对吞吐、内存、质量、模型兼容性或现有接口可能产生的影响。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可提供参考实现、论文、基准数据、截图或相关链接。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
        - label: 我愿意在需要时补充更多上下文或参与实现讨论。
          required: false
        - label: 我已阅读并同意遵守项目行为准则。
          required: true
